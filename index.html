<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0c14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ケイドロ プロトタイプ v0.3</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0c14; color: #cdd6e6;
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  /* 画面に収まるよう縦横比を保ったまま伸縮させる */
  #wrap {
    position: relative;
    width: min(100vw, calc((100dvh - 34px) * 960 / 728));
    aspect-ratio: 960 / 728;
    touch-action: none;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated;
    border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,.6);
  }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .note { font-size: 12px; color: #66718a; letter-spacing: .04em; text-align: center; padding: 0 8px; }
  #sound {
    font-family: inherit; font-size: 12px; letter-spacing: .04em; cursor: pointer;
    color: #9fd0ff; background: rgba(30,45,75,.6);
    border: 1px solid rgba(150,180,255,.35); border-radius: 6px; padding: 5px 12px;
    -webkit-tap-highlight-color: transparent;
  }
  #sound.off { color: #5a6479; background: rgba(24,30,44,.6); border-color: rgba(120,140,190,.18); }

  /* --- タッチ操作。指が乗る端末でだけ出す --- */
  #touch { position: absolute; inset: 0; display: none; }
  body.touch #touch { display: block; }
  #stick, #knob, #dash {
    position: absolute; border-radius: 50%; pointer-events: none;
    box-sizing: border-box;
  }
  #stick {
    width: 30%; aspect-ratio: 1; border: 2px solid rgba(150,180,255,.30);
    background: rgba(20,28,48,.30); opacity: 0; transition: opacity .12s;
    transform: translate(-50%, -50%);
  }
  #stick.on { opacity: 1; }
  #knob {
    width: 13%; aspect-ratio: 1; background: rgba(120,170,255,.55);
    border: 2px solid rgba(200,225,255,.8);
    transform: translate(-50%, -50%); opacity: 0; transition: opacity .12s;
  }
  #knob.on { opacity: 1; }
  #dash {
    right: 4%; bottom: 5%; width: 20%; aspect-ratio: 1;
    background: rgba(30,45,75,.5); border: 2px solid rgba(150,180,255,.45);
    display: flex; align-items: center; justify-content: center;
    color: #9fd0ff; font-size: 3.2vw; font-weight: bold; letter-spacing: .05em;
  }
  #dash.on { background: rgba(78,163,255,.55); border-color: #cfe6ff; color: #fff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="728"></canvas>
  <div id="touch">
    <div id="stick"></div>
    <div id="knob"></div>
    <div id="dash">走る</div>
  </div>
</div>
<div class="bar">
  <button id="sound" type="button">♪ 音 ON</button>
  <span class="note">WASD / 矢印キー：移動　　Shift：ダッシュ　　R：リスタート　　M：音</span>
</div>

<script>
'use strict';

// ---------------------------------------------------------------------------
// 調整パラメータ（プロトタイプの目的は数値を触って感触を確かめること）
// ---------------------------------------------------------------------------
const T = {
  timeLimit: 180,        // 制限時間（秒）
  // 速度設計：素の足は警察が速い（長期戦なら必ず追いつく）が、
  // ダッシュ中だけは泥棒が速い（短期的には振り切れる）。決着はスタミナがつける。
  copSpeed: 132,         // 警察の基本速度（px/秒）
  copDash: 190,          // 警察のダッシュ速度
  copDashTime: 4.0,      // ダッシュ持続（秒）
  copRecover: 5.0,       // スタミナ全回復（秒）
  thiefSpeed: 119,       // 泥棒の基本速度
  thiefDash: 200,        // 泥棒のダッシュ速度
  thiefDashTime: 2.6,
  thiefRecover: 7.0,
  // スタミナが尽きたら息切れ状態になり、この割合まで戻るまで再ダッシュできない
  exhaustThreshold: 0.35,
  markDuration: 3.0,     // エリアを出た泥棒が見え続ける秒数
  // 泥棒の3状態：遠い＝徘徊 / 気配を感じる＝距離を取る / 見つかった＝全力逃走
  noticeRange: 7,        // 逃走に切り替わる距離（マス／通路沿い）
  awareRange: 16,        // 気配を感じて距離を取り始める距離
  fleeMemory: 3.0,       // 見失ってから逃走をやめるまでの秒数
  catchDist: 15,         // 収監が成立する距離（px）
  repathInterval: 0.4,   // 逃走先を選び直す間隔（秒）
  avoidRepath: 0.8,      // 回避先を見直す間隔（秒）
  wanderRepath: 1.5,     // 徘徊先を見直す間隔（秒）

  // 味方AI警官：発見と足止めはできるが、収監できるのはプレイヤーだけ。
  // 位置は常に見えるので、その警戒状態がそのまま索敵の手がかりになる。
  allySpeed: 126,        // 平時の巡回速度
  allyChase: 158,        // 警戒時の追跡速度
  allyNotice: 6,         // 泥棒を発見する距離（マス／通路沿い）
  allyAlertMemory: 3.0,  // 見失ってから警戒を解くまでの秒数
  allyRepath: 0.4,       // 警戒時に進路を引き直す間隔（秒）
  pinDuration: 4.0,      // 足止めされる秒数（この間にプレイヤーが駆けつける）
  pinImmunity: 5.0,      // 足止め直後、再び足止めされない秒数
};

// ---------------------------------------------------------------------------
// マップ（30×21マス＝3×3エリア、1エリア＝10×7マス）
// ---------------------------------------------------------------------------
const MAP = [
  '##############################',
  '#............#...............#',
  '#.####.####..#..####..#####..#',
  '#.#.......#..#..#..........#.#',
  '#.#.####..#.....#..####..#.#.#',
  '#...#..#..######...#..#..#...#',
  '#####..#.......#...#..####.###',
  '#......#..###..#...#.......#.#',
  '#..#####..#....#####..####.#.#',
  '#..#......#.........#....#...#',
  '#..#..#####..#####..#.##.#.###',
  '#.....#......#...#..#.#..#...#',
  '####..#..#####...#..#.#..###.#',
  '#.....#..#.......#....#......#',
  '#..####..#..######..###..###.#',
  '#..#.....#.......#..#....#...#',
  '#..#..####..####.#..#..###.#.#',
  '#.....#.....#....#..#......#.#',
  '#..####..####..###..#####..#.#',
  '#..........#...............#.#',
  '##############################',
];

const TILE = 32;
const MW = MAP[0].length, MH = MAP.length;      // 30 x 21
const FIELD_W = MW * TILE, FIELD_H = MH * TILE; // 960 x 672
const HUD_H = 56;

const AW = MW / 3, AH = MH / 3;                  // エリア 10 x 7 マス
const AREA_NAMES = [
  ['北西', '北', '北東'],
  ['西',   '中央', '東'],
  ['南西', '南', '南東'],
];

const JAIL = { c0: 25, r0: 17, c1: 26, r1: 19 }; // 南東エリアの隅
const PLAYER_START = { c: 22, r: 19 }; // 牢屋のある南東から出発する
const ALLY_START = { c: 15, r: 9 };    // 味方AI警官は中央から巡回を始める
// 牢屋（南東）から遠い4エリアに1人ずつ散らす。固めると団子で一網打尽になる。
const THIEF_STARTS = [{ c: 2, r: 1 }, { c: 15, r: 1 }, { c: 25, r: 1 }, { c: 5, r: 9 }];

const solid = [];
for (let r = 0; r < MH; r++) for (let c = 0; c < MW; c++) solid[r * MW + c] = MAP[r][c] === '#';

const isWall = (c, r) => c < 0 || r < 0 || c >= MW || r >= MH || solid[r * MW + c];
const tileIndex = (c, r) => r * MW + c;
const areaOf = (x, y) => {
  const ac = Math.min(2, Math.floor(x / (FIELD_W / 3)));
  const ar = Math.min(2, Math.floor(y / (FIELD_H / 3)));
  return ar * 3 + ac;
};
const centerOf = (c, r) => ({ x: c * TILE + TILE / 2, y: r * TILE + TILE / 2 });

// 各床マスの「開放度」（隣接する床の数）。行き止まりを避けるために使う。
const openness = new Array(MW * MH).fill(0);
for (let r = 0; r < MH; r++) for (let c = 0; c < MW; c++) {
  if (isWall(c, r)) continue;
  let n = 0;
  if (!isWall(c + 1, r)) n++;
  if (!isWall(c - 1, r)) n++;
  if (!isWall(c, r + 1)) n++;
  if (!isWall(c, r - 1)) n++;
  openness[tileIndex(c, r)] = n;
}

// ---------------------------------------------------------------------------
// 経路探索（幅優先。630マスなので毎フレーム回しても軽い）
// ---------------------------------------------------------------------------
const DX = [1, -1, 0, 0], DY = [0, 0, 1, -1];
const bfsQueue = new Int32Array(MW * MH);
function bfs(startC, startR, out) {
  out.fill(-1);
  if (isWall(startC, startR)) return out;
  let head = 0, tail = 0;
  const s = tileIndex(startC, startR);
  out[s] = 0;
  bfsQueue[tail++] = s;
  while (head < tail) {
    const cur = bfsQueue[head++];
    const cc = cur % MW, cr = (cur / MW) | 0, d = out[cur] + 1;
    for (let i = 0; i < 4; i++) {
      const nc = cc + DX[i], nr = cr + DY[i];
      if (isWall(nc, nr)) continue;
      const ni = tileIndex(nc, nr);
      if (out[ni] !== -1) continue;
      out[ni] = d;
      bfsQueue[tail++] = ni;
    }
  }
  return out;
}

const distFromCop = new Int32Array(MW * MH);
const distFromAlly = new Int32Array(MW * MH);
const threatDist = new Int32Array(MW * MH);  // 警察と仲間の、近いほうまでの距離
const scratchDist = new Int32Array(MW * MH); // 逃走先の選定に使い回す

// ---------------------------------------------------------------------------
// 当たり判定（円をAABBで近似。軸ごとに動かして壁ずりを効かせる）
// ---------------------------------------------------------------------------
const RADIUS = 9;          // 描画サイズと揃える。これより太いと見た目より引っかかる
const CORNER_ASSIST = 13;  // 角を曲がるとき、通路の口へ自動で寄せてやる最大幅（px）
const CORNER_SLIDE = 2.2;  // 寄せる速さの倍率。小さいと曲がりだしが重く、大きいと滑る

function blocked(x, y) {
  const c0 = Math.floor((x - RADIUS) / TILE), c1 = Math.floor((x + RADIUS) / TILE);
  const r0 = Math.floor((y - RADIUS) / TILE), r1 = Math.floor((y + RADIUS) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (isWall(c, r)) return true;
  return false;
}

// 通路幅32pxに対し判定は直径18px。素直に軸分離で当てると、曲がれる帯が
// 14pxしかなく角に刺さる。進みたい方向が塞がれていても、垂直に少しずらせば
// 通れる場合はそちらへ寄せることで、曲がり角を曲がりやすくする。
function slideAssist(e, dx, dy, axis) {
  const speed = Math.hypot(dx, dy);
  for (let off = 1; off <= CORNER_ASSIST; off++) {
    for (const sign of [-1, 1]) {
      const ok = axis === 'x'
        ? !blocked(e.x + dx, e.y + sign * off)
        : !blocked(e.x + sign * off, e.y + dy);
      if (!ok) continue;
      const step = sign * Math.min(speed * CORNER_SLIDE, off);
      if (axis === 'x') { if (!blocked(e.x, e.y + step)) e.y += step; }
      else { if (!blocked(e.x + step, e.y)) e.x += step; }
      return;
    }
  }
}

// 通路を直進している間、入力のない側を通路の中心へ寄せる。
// 角に着いた時点で位置が揃っているので、曲がるのに失敗しなくなる。
// 開けた場所では効かせない（吸い付く感触になるため）。
const CENTER_ASSIST = 0.55; // 移動速度に対する寄せ速度の比
function centerAssist(e, dx, dy) {
  const c = Math.floor(e.x / TILE), r = Math.floor(e.y / TILE);
  const rate = Math.hypot(dx, dy) * CENTER_ASSIST;
  if (dx && !dy) {
    if (!isWall(c, r - 1) && !isWall(c, r + 1)) return;
    const d = r * TILE + TILE / 2 - e.y;
    if (Math.abs(d) < 0.5) return;
    const step = Math.sign(d) * Math.min(rate, Math.abs(d));
    if (!blocked(e.x, e.y + step)) e.y += step;
  } else if (dy && !dx) {
    if (!isWall(c - 1, r) && !isWall(c + 1, r)) return;
    const d = c * TILE + TILE / 2 - e.x;
    if (Math.abs(d) < 0.5) return;
    const step = Math.sign(d) * Math.min(rate, Math.abs(d));
    if (!blocked(e.x + step, e.y)) e.x += step;
  }
}

function moveEntity(e, dx, dy) {
  if (dx) {
    if (!blocked(e.x + dx, e.y)) e.x += dx;
    else slideAssist(e, dx, 0, 'x');
  }
  if (dy) {
    if (!blocked(e.x, e.y + dy)) e.y += dy;
    else slideAssist(e, 0, dy, 'y');
  }
  centerAssist(e, dx, dy);
}

// ---------------------------------------------------------------------------
// ゲーム状態
// ---------------------------------------------------------------------------
let cop, ally, thieves, timeLeft, phase, effects, elapsed;
// 効果音を「変化した瞬間」だけ鳴らすための直前の状態
const cue = { visible: 0, allyAlert: false, exhausted: false, sec: 0 };

function reset() {
  const p = centerOf(PLAYER_START.c, PLAYER_START.r);
  cop = { x: p.x, y: p.y, stamina: 1, exhausted: false, dashing: false, facing: 0 };
  const a = centerOf(ALLY_START.c, ALLY_START.r);
  ally = {
    x: a.x, y: a.y,
    state: 'patrol',         // patrol（平時） | alert（警戒）
    target: null,
    alertTimer: 0,
    goal: null,
    goalDist: new Int32Array(MW * MH),
    repath: 0,
  };
  thieves = THIEF_STARTS.map((s, i) => {
    const c = centerOf(s.c, s.r);
    return {
      id: i, x: c.x, y: c.y,
      stamina: 1, exhausted: false, jailed: false,
      state: 'wander',       // wander | avoid | flee
      fleeTimer: 0,
      mark: 0,               // エリア外でも見え続ける残り秒数
      stun: 0,               // 仲間に足止めされている残り秒数
      immune: 0,             // 足止め直後の無敵時間
      goal: null,            // 目標マス
      goalDist: new Int32Array(MW * MH),
      repath: 0,
    };
  });
  timeLeft = T.timeLimit;
  elapsed = 0;
  phase = 'play';            // play | win | lose
  effects = [];
  cue.visible = 0; cue.allyAlert = false; cue.exhausted = false; cue.sec = T.timeLimit;
  Snd.music(true);
}

// ---------------------------------------------------------------------------
// サウンド（外部ファイルなし。Web Audio ですべて合成する）
//
// 曲は状況に追従させる。何も見えていないときは静かな脈打ちだけ、泥棒を視認
// すると打ち込みと不協和音が乗り、残り時間が減るほどテンポが上がる。
// ---------------------------------------------------------------------------
const Snd = (() => {
  let ctx = null, master, musicBus, sfxBus, noiseBuf;
  let enabled = true, timer = null, nextTime = 0, step = 0;
  let intensity = 0, pressure = 0;

  // ニ短調。増4度（D-Ab）を混ぜて落ち着かない響きにする。
  const N = { D2: 73.42, E2: 82.41, F2: 87.31, G2: 98.00, Ab2: 103.83, Bb2: 116.54,
              D4: 293.66, Eb4: 311.13, F4: 349.23, A4: 440.00, Ab4: 415.30, D5: 587.33 };
  const BASS = [N.D2, 0, N.D2, 0, N.D2, 0, N.F2, 0, N.D2, 0, N.D2, 0, N.E2, 0, N.Bb2, 0];

  function ensure() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.45; musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    noiseBuf = ctx.createBuffer(1, (ctx.sampleRate * 0.4) | 0, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }

  // --- 音源 -----------------------------------------------------------------
  function tone(t, freq, dur, vol, type, bus, sweepTo) {
    const o = ctx.createOscillator(); o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(bus);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(t, dur, vol, hp, bus) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(bus);
    s.start(t); s.stop(t + dur + 0.02);
  }
  function kick(t, vol) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(155, t);
    o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
    o.connect(g).connect(musicBus);
    o.start(t); o.stop(t + 0.21);
  }
  function bassNote(t, freq, dur, vol) {
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(freq * 8, t);
    f.frequency.exponentialRampToValueAtTime(freq * 2.2, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f).connect(g).connect(musicBus);
    o.start(t); o.stop(t + dur + 0.02);
  }

  // --- 1拍ぶんの譜面 ---------------------------------------------------------
  function playStep(s, t, stepDur) {
    const hot = intensity >= 2, mid = intensity >= 1;

    // 低音の脈。これが常に鳴っていることで「止まっていない」感じを出す
    const b = BASS[s];
    if (b) bassNote(t, b, stepDur * 1.7, hot ? 0.30 : mid ? 0.24 : 0.17);

    // キックは 0/6/10 の食い気味な位置に置いて落ち着かなくする
    if (s === 0 || s === 6 || s === 10) kick(t, hot ? 0.55 : mid ? 0.45 : 0.32);

    if (mid && s % 2 === 1) noise(t, 0.035, hot ? 0.16 : 0.09, 7500, musicBus);
    if (hot && s % 2 === 0) noise(t, 0.02, 0.07, 9000, musicBus);

    // 視認中だけ、高音の短2度がぶつかる音形を重ねる
    if (hot) {
      if (s === 0) { tone(t, N.D5, 0.09, 0.10, 'square', musicBus); }
      if (s === 4) { tone(t, N.Eb4, 0.09, 0.09, 'square', musicBus); }
      if (s === 8) { tone(t, N.A4, 0.09, 0.10, 'square', musicBus); }
      if (s === 12) { tone(t, N.Ab4, 0.12, 0.09, 'square', musicBus); }
      // 増4度のパッドを小節頭に薄く
      if (s === 0) {
        tone(t, N.D4, stepDur * 14, 0.035, 'sawtooth', musicBus);
        tone(t, N.Ab4, stepDur * 14, 0.030, 'sawtooth', musicBus);
      }
    }
    // 終盤は裏拍に時計の刻みを入れる
    if (pressure > 0.72 && s % 4 === 2) noise(t, 0.015, 0.10, 6000, musicBus);
  }

  function schedule() {
    if (!ctx || !enabled) return;
    // 残り時間が減るほど速くなる。追跡中はさらに一段上がる。
    const bpm = 126 + 34 * pressure + (intensity >= 2 ? 14 : intensity >= 1 ? 6 : 0);
    const stepDur = 60 / bpm / 4;
    // タブが裏に回るとタイマーが間引かれて大きく遅れる。取り戻そうとせず貼り直す。
    if (nextTime < ctx.currentTime) nextTime = ctx.currentTime + 0.02;
    while (nextTime < ctx.currentTime + 0.13) {
      playStep(step, nextTime, stepDur);
      nextTime += stepDur;
      step = (step + 1) % 16;
    }
  }

  // --- 効果音 ---------------------------------------------------------------
  const sfx = {
    spot() {   // 泥棒を視認した瞬間
      if (!ctx || !enabled) return;
      const t = ctx.currentTime;
      tone(t, 1180, 0.07, 0.22, 'square', sfxBus);
      tone(t + 0.07, 880, 0.10, 0.20, 'square', sfxBus);
    },
    capture() { // 収監
      if (!ctx || !enabled) return;
      const t = ctx.currentTime;
      noise(t, 0.10, 0.30, 900, sfxBus);
      tone(t, 330, 0.10, 0.26, 'triangle', sfxBus);
      tone(t + 0.09, 494, 0.11, 0.26, 'triangle', sfxBus);
      tone(t + 0.19, 659, 0.20, 0.24, 'triangle', sfxBus);
    },
    allyAlert() { // 仲間が警戒に入った（無線が入った合図）
      if (!ctx || !enabled) return;
      const t = ctx.currentTime;
      noise(t, 0.05, 0.10, 3000, sfxBus);
      tone(t + 0.03, 1560, 0.05, 0.16, 'square', sfxBus);
      tone(t + 0.12, 1560, 0.05, 0.16, 'square', sfxBus);
    },
    pin() {    // 仲間が泥棒を足止めした
      if (!ctx || !enabled) return;
      const t = ctx.currentTime;
      noise(t, 0.08, 0.26, 2600, sfxBus);
      tone(t, 780, 0.16, 0.18, 'square', sfxBus, 520);
    },
    gasp() {   // 息切れ
      if (!ctx || !enabled) return;
      noise(ctx.currentTime, 0.28, 0.13, 500, sfxBus);
    },
    warn() {   // 残り60秒・30秒
      if (!ctx || !enabled) return;
      const t = ctx.currentTime;
      tone(t, 220, 0.45, 0.22, 'sawtooth', sfxBus, 165);
    },
    tick() {   // 残り10秒からの秒読み
      if (!ctx || !enabled) return;
      tone(ctx.currentTime, 1900, 0.035, 0.20, 'square', sfxBus);
    },
    win() {
      if (!ctx || !enabled) return;
      const t = ctx.currentTime;
      [392, 494, 587, 784].forEach((f, i) =>
        tone(t + i * 0.11, f, 0.30, 0.24, 'triangle', sfxBus));
    },
    lose() {
      if (!ctx || !enabled) return;
      const t = ctx.currentTime;
      [392, 349, 294, 220].forEach((f, i) =>
        tone(t + i * 0.16, f, 0.42, 0.24, 'sawtooth', sfxBus));
    },
  };

  return Object.assign(sfx, {
    // 最初のユーザー操作で初めて鳴らせるようになる（ブラウザの自動再生制限）
    start() {
      if (!ensure()) return;
      if (ctx.state === 'suspended') ctx.resume();
      if (!timer) {
        nextTime = ctx.currentTime + 0.06;
        timer = setInterval(schedule, 25);
      }
    },
    // 毎フレーム、いまの緊張度を渡す
    set(i, p) { intensity = i; pressure = p; },
    music(on) {
      if (!ctx) return;
      musicBus.gain.setTargetAtTime(on ? 0.45 : 0.0001, ctx.currentTime, 0.08);
    },
    toggle() {
      enabled = !enabled;
      if (ctx) master.gain.setTargetAtTime(enabled ? 0.85 : 0.0001, ctx.currentTime, 0.05);
      return enabled;
    },
    get on() { return enabled; },
  });
})();

// ブラウザの自動再生制限により、最初のユーザー操作までは音を出せない
const soundBtn = document.getElementById('sound');
let audioStarted = false;
function unlockAudio() { audioStarted = true; Snd.start(); }
for (const ev of ['keydown', 'pointerdown', 'touchstart']) {
  addEventListener(ev, unlockAudio, { once: true, passive: true });
}
function toggleSound() {
  // まだ一度も鳴っていないなら、最初の一押しは「鳴らす」だけにする
  if (!audioStarted) { unlockAudio(); return; }
  const on = Snd.toggle();
  soundBtn.textContent = on ? '♪ 音 ON' : '♪ 音 OFF';
  soundBtn.classList.toggle('off', !on);
}
soundBtn.addEventListener('click', e => { e.preventDefault(); toggleSound(); });

const keys = Object.create(null);
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') reset();
  if (e.code === 'KeyM') toggleSound();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const held = (...codes) => codes.some(c => keys[c]);

// --- タッチ操作 -------------------------------------------------------------
// 左半分：触った位置に仮想スティックが出る。右下：ダッシュボタン。
const pad = { active: false, x: 0, y: 0, dash: false };
const wrapEl = document.getElementById('wrap');
const stickEl = document.getElementById('stick');
const knobEl = document.getElementById('knob');
const dashEl = document.getElementById('dash');
const STICK_RANGE = 0.11;   // 画面幅に対する、最大入力になるまでの距離
const STICK_DEAD = 0.022;   // 遊び

const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) {
  document.body.classList.add('touch');
  document.querySelector('.note').textContent = '左側をなぞって移動　　「走る」でダッシュ　　結果画面をタップでリスタート';
}

let stickId = null, dashId = null, origin = null;

function localPos(t) {
  const r = wrapEl.getBoundingClientRect();
  return { x: (t.clientX - r.left) / r.width, y: (t.clientY - r.top) / r.height, w: r.width };
}
function inDashButton(p) {
  // CSS上のダッシュボタン（右4%・下5%・幅20%）に指が乗ったか
  const ar = 960 / 728;
  const bw = 0.20, bh = bw * ar;
  return p.x > 1 - 0.04 - bw && p.y > 1 - 0.05 - bh;
}
function applyStick(p) {
  const dx = (p.x - origin.x), dy = (p.y - origin.y) / (728 / 960); // 縦横比を揃える
  const len = Math.hypot(dx, dy);
  if (len < STICK_DEAD) { pad.active = false; knobEl.classList.remove('on'); return; }
  const k = Math.min(1, len / STICK_RANGE);
  pad.active = true;
  pad.x = dx / len; pad.y = dy / len;
  knobEl.classList.add('on');
  knobEl.style.left = (origin.x + pad.x * STICK_RANGE * k) * 100 + '%';
  knobEl.style.top = (origin.y + pad.y * STICK_RANGE * k * (728 / 960)) * 100 + '%';
}

wrapEl.addEventListener('touchstart', ev => {
  ev.preventDefault();
  if (phase !== 'play') { reset(); return; }
  for (const t of ev.changedTouches) {
    const p = localPos(t);
    if (dashId === null && inDashButton(p)) {
      dashId = t.identifier; pad.dash = true; dashEl.classList.add('on');
    } else if (stickId === null) {
      stickId = t.identifier; origin = p;
      stickEl.style.left = p.x * 100 + '%';
      stickEl.style.top = p.y * 100 + '%';
      stickEl.classList.add('on');
      applyStick(p);
    }
  }
}, { passive: false });

wrapEl.addEventListener('touchmove', ev => {
  ev.preventDefault();
  for (const t of ev.changedTouches) {
    if (t.identifier === stickId) applyStick(localPos(t));
  }
}, { passive: false });

function endTouch(ev) {
  ev.preventDefault();
  for (const t of ev.changedTouches) {
    if (t.identifier === stickId) {
      stickId = null; origin = null; pad.active = false;
      stickEl.classList.remove('on'); knobEl.classList.remove('on');
    }
    if (t.identifier === dashId) {
      dashId = null; pad.dash = false; dashEl.classList.remove('on');
    }
  }
}
wrapEl.addEventListener('touchend', endTouch, { passive: false });
wrapEl.addEventListener('touchcancel', endTouch, { passive: false });

// マウスでも結果画面をクリックでリスタートできるようにしておく
wrapEl.addEventListener('pointerdown', ev => {
  if (ev.pointerType !== 'touch' && phase !== 'play') reset();
});

// ---------------------------------------------------------------------------
// 更新
// ---------------------------------------------------------------------------
function updateCop(dt) {
  let dx = 0, dy = 0;
  if (held('KeyA', 'ArrowLeft')) dx -= 1;
  if (held('KeyD', 'ArrowRight')) dx += 1;
  if (held('KeyW', 'ArrowUp')) dy -= 1;
  if (held('KeyS', 'ArrowDown')) dy += 1;
  if (!dx && !dy && pad.active) { dx = pad.x; dy = pad.y; }

  const moving = dx || dy;
  const wantDash = (held('ShiftLeft', 'ShiftRight') || pad.dash) && moving && !cop.exhausted && cop.stamina > 0;
  cop.dashing = wantDash;

  if (wantDash) {
    cop.stamina = Math.max(0, cop.stamina - dt / T.copDashTime);
    if (cop.stamina === 0) cop.exhausted = true;
  } else {
    cop.stamina = Math.min(1, cop.stamina + dt / T.copRecover);
    if (cop.stamina >= T.exhaustThreshold) cop.exhausted = false;
  }

  if (moving) {
    const len = Math.hypot(dx, dy);
    const sp = (wantDash ? T.copDash : T.copSpeed) * dt;
    moveEntity(cop, (dx / len) * sp, (dy / len) * sp);
    cop.facing = Math.atan2(dy, dx);
  }
}

// 逃走先を選ぶ：追手から遠く、自分からは近く、行き止まりでないマス。
function pickFleeGoal(t) {
  const tc = Math.floor(t.x / TILE), tr = Math.floor(t.y / TILE);
  const fromThief = bfs(tc, tr, scratchDist);
  const copArea = areaOf(cop.x, cop.y), allyArea = areaOf(ally.x, ally.y);
  let best = -Infinity, goal = null;
  for (let r = 0; r < MH; r++) for (let c = 0; c < MW; c++) {
    const i = tileIndex(c, r);
    if (isWall(c, r) || fromThief[i] < 0) continue;
    const dCop = threatDist[i] < 0 ? 0 : threatDist[i];
    // 行き止まりは追い詰められるので強く避ける
    const penalty = openness[i] <= 1 ? 15 : 0;
    // 追手のいるエリアから出ることを優先する（視界を切るのが最大の防御）
    const a = areaOf(c * TILE + TILE / 2, r * TILE + TILE / 2);
    const escape = (a !== copArea ? 4 : 0) + (a !== allyArea ? 2 : 0);
    const score = dCop + escape - fromThief[i] * 0.25 - penalty + Math.random() * 1.5;
    if (score > best) { best = score; goal = { c, r }; }
  }
  return goal;
}

// 徘徊先：追手から十分離れていて、追手のいるエリアでもないマス。
// ここを無条件のランダムにすると、泥棒が自分から警察に歩いてきて索敵が成立しない。
function pickWanderGoal(t) {
  const copArea = areaOf(cop.x, cop.y), allyArea = areaOf(ally.x, ally.y);
  let fallback = null;
  for (let tries = 0; tries < 80; tries++) {
    const c = (Math.random() * MW) | 0, r = (Math.random() * MH) | 0;
    const i = tileIndex(c, r);
    if (isWall(c, r) || openness[i] <= 1) continue;
    const dCop = threatDist[i];
    if (dCop >= 0 && dCop < T.noticeRange) continue;
    if (!fallback) fallback = { c, r };
    if (dCop >= 0 && dCop < T.awareRange) continue;
    const a = areaOf(c * TILE + TILE / 2, r * TILE + TILE / 2);
    if (a === copArea || a === allyArea) continue;
    return { c, r };
  }
  return fallback;
}

// 距離場の勾配で操舵する。マス中心を順に辿らせると角を斜めに抜けられず、
// 直線的に追ってくる相手に一方的に詰められてしまう。泥棒と仲間で共用。
function steerField(e, field, speed) {
  const tc = Math.floor(e.x / TILE), tr = Math.floor(e.y / TILE);
  const here = field[tileIndex(tc, tr)];
  let vx = 0, vy = 0;
  if (here >= 0) {
    for (let i = 0; i < 4; i++) {
      const cc = tc + DX[i], cr = tr + DY[i];
      if (isWall(cc, cr)) continue;
      const d = field[tileIndex(cc, cr)];
      if (d < 0) continue;
      const w = here - d;               // 下り方向の強さ
      if (w > 0) { vx += DX[i] * w; vy += DY[i] * w; }
    }
  }
  const g = Math.hypot(vx, vy);
  const c0 = centerOf(tc, tr);
  // 進行方向1マス先を狙う。通路の中心に戻す力も同時に働く。
  const aimX = g > 0 ? c0.x + (vx / g) * TILE : c0.x;
  const aimY = g > 0 ? c0.y + (vy / g) * TILE : c0.y;
  const sx = aimX - e.x, sy = aimY - e.y;
  const len = Math.hypot(sx, sy);
  if (len > 0.5) moveEntity(e, (sx / len) * speed, (sy / len) * speed);
}

function setGoal(t, goal) {
  t.goal = goal;
  if (goal) bfs(goal.c, goal.r, t.goalDist);
}

function updateThief(t, dt) {
  if (t.jailed) return;

  if (t.immune > 0) t.immune -= dt;

  // 仲間に足止めされている間は動けない。プレイヤーが駆けつける猶予になる。
  if (t.stun > 0) {
    t.stun -= dt;
    if (t.stun <= 0) t.immune = T.pinImmunity;
    if (Math.hypot(t.x - cop.x, t.y - cop.y) < T.catchDist) jail(t);
    return;
  }

  const tc = Math.floor(t.x / TILE), tr = Math.floor(t.y / TILE);
  // 脅威は警察と仲間のうち近いほう。仲間を無視すると自分から突っ込んでいく。
  const dCop = threatDist[tileIndex(tc, tr)];
  const noticed = dCop >= 0 && dCop <= T.noticeRange;
  const sensed = dCop >= 0 && dCop <= T.awareRange;

  const prev = t.state;
  if (noticed) {
    t.state = 'flee';
    t.fleeTimer = T.fleeMemory;
  } else if (t.state === 'flee') {
    t.fleeTimer -= dt;
    if (t.fleeTimer <= 0) t.state = sensed ? 'avoid' : 'wander';
  } else {
    t.state = sensed ? 'avoid' : 'wander';
  }
  if (t.state !== prev) t.goal = null;

  // 目標の更新
  t.repath -= dt;
  const reached = t.goal && Math.floor(t.x / TILE) === t.goal.c && Math.floor(t.y / TILE) === t.goal.r;
  if (!t.goal || reached || t.repath <= 0) {
    setGoal(t, t.state === 'wander' ? pickWanderGoal(t) : pickFleeGoal(t));
    t.repath = t.state === 'flee' ? T.repathInterval
             : t.state === 'avoid' ? T.avoidRepath : T.wanderRepath;
  }

  // スタミナ：全力逃走のときだけダッシュを使う。回避は歩いて距離を取るだけ。
  const wantDash = t.state === 'flee' && !t.exhausted && t.stamina > 0;
  if (wantDash) {
    t.stamina = Math.max(0, t.stamina - dt / T.thiefDashTime);
    if (t.stamina === 0) t.exhausted = true;
  } else {
    t.stamina = Math.min(1, t.stamina + dt / T.thiefRecover);
    if (t.stamina >= T.exhaustThreshold) t.exhausted = false;
  }
  const speed = (wantDash ? T.thiefDash : T.thiefSpeed) * dt;

  if (t.goal) steerField(t, t.goalDist, speed);

  // 収監判定
  if (Math.hypot(t.x - cop.x, t.y - cop.y) < T.catchDist) jail(t);
}

// 味方AI警官。巡回して泥棒を探し、見つけたら追って足止めする。収監はできない。
// プレイヤーからは位置と警戒状態が常に見えるので、これ自体が索敵の情報源になる。
function updateAlly(dt) {
  const ac = Math.floor(ally.x / TILE), ar = Math.floor(ally.y / TILE);

  // 発見：巡回中でも追跡中でも、近くの捕まっていない泥棒を見つける
  let seen = null, bd = Infinity;
  for (const t of thieves) {
    if (t.jailed) continue;
    const d = distFromAlly[tileIndex(Math.floor(t.x / TILE), Math.floor(t.y / TILE))];
    if (d >= 0 && d <= T.allyNotice && d < bd) { bd = d; seen = t; }
  }

  const prev = ally.state;
  if (seen) {
    ally.state = 'alert';
    ally.target = seen;
    ally.alertTimer = T.allyAlertMemory;
  } else if (ally.state === 'alert') {
    ally.alertTimer -= dt;
    if (ally.alertTimer <= 0 || !ally.target || ally.target.jailed) {
      ally.state = 'patrol';
      ally.target = null;
    }
  }
  if (ally.state !== prev) { ally.goal = null; ally.repath = 0; }

  ally.repath -= dt;
  if (ally.state === 'alert' && ally.target) {
    // 追跡中は目標の現在地へ引き直し続ける
    if (ally.repath <= 0) {
      const t = ally.target;
      bfs(Math.floor(t.x / TILE), Math.floor(t.y / TILE), ally.goalDist);
      ally.repath = T.allyRepath;
    }
    steerField(ally, ally.goalDist, T.allyChase * dt);

    // 接触：足止めする。収監はプレイヤーだけの仕事。
    const t = ally.target;
    if (!t.jailed && t.stun <= 0 && t.immune <= 0 &&
        Math.hypot(t.x - ally.x, t.y - ally.y) < T.catchDist) {
      t.stun = T.pinDuration;
      Snd.pin();
      effects.push({ x: t.x, y: t.y, life: 0.5, max: 0.5 });
    }
  } else {
    // 巡回：適当に離れたマスを目指して歩き回る
    const reached = ally.goal && ac === ally.goal.c && ar === ally.goal.r;
    if (!ally.goal || reached || ally.repath <= 0) {
      for (let tries = 0; tries < 60; tries++) {
        const c = (Math.random() * MW) | 0, r = (Math.random() * MH) | 0;
        if (isWall(c, r) || openness[tileIndex(c, r)] <= 1) continue;
        if (Math.hypot(c - ac, r - ar) < 8) continue;
        ally.goal = { c, r };
        bfs(c, r, ally.goalDist);
        break;
      }
      ally.repath = 3.0;
    }
    if (ally.goal) steerField(ally, ally.goalDist, T.allySpeed * dt);
  }
}

function jail(t) {
  t.jailed = true;
  t.mark = 0;
  t.stun = 0;
  Snd.capture();
  effects.push({ x: t.x, y: t.y, life: 0.5, max: 0.5 });
  const slot = thieves.filter(o => o.jailed).length - 1;
  const c = JAIL.c0 + (slot % 2), r = JAIL.r0 + Math.floor(slot / 2);
  const p = centerOf(c, r);
  t.x = p.x; t.y = p.y;
}

function update(dt) {
  if (phase !== 'play') return;

  elapsed += dt;
  timeLeft -= dt;

  updateCop(dt);
  bfs(Math.floor(cop.x / TILE), Math.floor(cop.y / TILE), distFromCop);
  bfs(Math.floor(ally.x / TILE), Math.floor(ally.y / TILE), distFromAlly);
  for (let i = 0; i < threatDist.length; i++) {
    const a = distFromCop[i], b = distFromAlly[i];
    threatDist[i] = a < 0 ? b : b < 0 ? a : Math.min(a, b);
  }

  updateAlly(dt);

  const copArea = areaOf(cop.x, cop.y);
  for (const t of thieves) {
    updateThief(t, dt);
    if (!t.jailed) {
      // 同エリアにいれば見える。出た後も markDuration 秒は輪郭が残る。
      if (areaOf(t.x, t.y) === copArea) t.mark = T.markDuration;
      else t.mark = Math.max(0, t.mark - dt);
    }
  }

  for (const e of effects) e.life -= dt;
  effects = effects.filter(e => e.life > 0);

  // --- 音の契機。状態が切り替わった瞬間だけ鳴らす ---
  const visNow = thieves.filter(t => !t.jailed && areaOf(t.x, t.y) === copArea).length;
  if (visNow > cue.visible) Snd.spot();
  cue.visible = visNow;

  const alertNow = ally.state === 'alert';
  if (alertNow && !cue.allyAlert) Snd.allyAlert();
  cue.allyAlert = alertNow;

  if (cop.exhausted && !cue.exhausted) Snd.gasp();
  cue.exhausted = cop.exhausted;

  const sec = Math.ceil(timeLeft);
  if (sec !== cue.sec) {
    if (timeLeft <= 10) Snd.tick();
    else if (sec === 30 || sec === 60) Snd.warn();
    cue.sec = sec;
  }

  // 緊張度：視認中＝2、仲間が警戒中＝1、それ以外＝0。時間が減るほど速くなる。
  Snd.set(visNow > 0 ? 2 : alertNow ? 1 : 0, 1 - timeLeft / T.timeLimit);

  if (thieves.every(t => t.jailed)) { phase = 'win'; Snd.music(false); Snd.win(); }
  else if (timeLeft <= 0) { timeLeft = 0; phase = 'lose'; Snd.music(false); Snd.lose(); }
}

// ---------------------------------------------------------------------------
// 描画
// ---------------------------------------------------------------------------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function drawMap() {
  ctx.fillStyle = '#161b28';
  ctx.fillRect(0, 0, FIELD_W, FIELD_H);
  for (let r = 0; r < MH; r++) for (let c = 0; c < MW; c++) {
    const x = c * TILE, y = r * TILE;
    if (isWall(c, r)) {
      ctx.fillStyle = '#333c55';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#3f4a68';
      ctx.fillRect(x, y, TILE, 3);
    } else {
      ctx.fillStyle = (c + r) % 2 ? '#1b2130' : '#1e2434';
      ctx.fillRect(x, y, TILE, TILE);
    }
  }
}

function drawJail() {
  const x = JAIL.c0 * TILE, y = JAIL.r0 * TILE;
  const w = (JAIL.c1 - JAIL.c0 + 1) * TILE, h = (JAIL.r1 - JAIL.r0 + 1) * TILE;
  ctx.fillStyle = 'rgba(120,150,220,.12)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(150,180,255,.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = 'rgba(170,195,255,.55)';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('牢屋', x + w / 2, y - 5);
}

function drawFog(copArea) {
  const aw = FIELD_W / 3, ah = FIELD_H / 3;
  for (let a = 0; a < 9; a++) {
    if (a === copArea) continue;
    const ax = (a % 3) * aw, ay = Math.floor(a / 3) * ah;
    ctx.fillStyle = 'rgba(6,8,16,.78)';
    ctx.fillRect(ax, ay, aw, ah);
  }
  // エリア境界
  ctx.strokeStyle = 'rgba(120,140,190,.16)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(i * aw, 0); ctx.lineTo(i * aw, FIELD_H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * ah); ctx.lineTo(FIELD_W, i * ah); ctx.stroke();
  }
  // 現在エリアを縁取り
  const cx = (copArea % 3) * aw, cy = Math.floor(copArea / 3) * ah;
  ctx.strokeStyle = 'rgba(140,190,255,.35)';
  ctx.lineWidth = 2;
  ctx.strokeRect(cx + 1, cy + 1, aw - 2, ah - 2);

  // 仲間が警戒中のエリアを琥珀色に光らせる。
  // 「あそこに泥棒がいる」がマップを一目見るだけで伝わるようにする。
  if (ally.state === 'alert') {
    const a = areaOf(ally.x, ally.y);
    const ax = (a % 3) * aw, ay = Math.floor(a / 3) * ah;
    const pulse = 0.5 + 0.5 * Math.sin(elapsed * 6);
    ctx.fillStyle = `rgba(255,180,60,${0.05 + 0.05 * pulse})`;
    ctx.fillRect(ax, ay, aw, ah);
    ctx.strokeStyle = `rgba(255,190,80,${0.45 + 0.35 * pulse})`;
    ctx.lineWidth = 3;
    ctx.strokeRect(ax + 2, ay + 2, aw - 4, ah - 4);
  }
}

// 味方AI警官。フォグの上に描くので、どのエリアにいても常に見える。
function drawAlly() {
  const alert = ally.state === 'alert';
  const pulse = 0.5 + 0.5 * Math.sin(elapsed * 6);

  if (alert) {
    // 警戒中は外側に広がる輪を出す
    ctx.strokeStyle = `rgba(255,180,60,${0.5 * (1 - pulse)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ally.x, ally.y, 10 + pulse * 12, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.fillStyle = alert ? '#ffb43c' : '#5a86c4';
  ctx.beginPath(); ctx.arc(ally.x, ally.y, 8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = alert ? '#fff0cf' : '#9fb8dd';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(ally.x, ally.y, 8, 0, Math.PI * 2); ctx.stroke();

  // 平時か警戒かを文字でも出す（色だけだと小さくて読み取りにくい）
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px system-ui';
  if (alert) {
    ctx.fillStyle = '#ffd35c';
    ctx.fillText('警戒', ally.x, ally.y - 14);
  } else {
    ctx.fillStyle = 'rgba(159,184,221,.75)';
    ctx.fillText('仲間', ally.x, ally.y - 14);
  }
}

function drawThief(t, copArea) {
  if (t.jailed) {
    ctx.fillStyle = '#5d667e'; // 収監済みは灰色。エリア外でも常に見える
    ctx.beginPath(); ctx.arc(t.x, t.y, 7, 0, Math.PI * 2); ctx.fill();
    return;
  }
  // 足止め中は、フォグ越しでも見える。駆けつければ収監できると分かるように。
  const inArea = areaOf(t.x, t.y) === copArea;
  if (t.stun > 0) {
    const pulse = 0.5 + 0.5 * Math.sin(elapsed * 10);
    ctx.strokeStyle = `rgba(255,210,90,${0.55 + 0.35 * pulse})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(t.x, t.y, 13, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#ff7a45';
    ctx.beginPath(); ctx.arc(t.x, t.y, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd35c';
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('確保', t.x, t.y - 17);
    return;
  }
  if (inArea) {
    ctx.fillStyle = '#ff7a45';
    ctx.beginPath(); ctx.arc(t.x, t.y, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,190,150,.9)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(t.x, t.y, 8, 0, Math.PI * 2); ctx.stroke();
    // 状態を読ませる：! = 全力逃走中、? = こちらの気配に気づいて距離を取っている
    if (t.state === 'flee' || t.state === 'avoid') {
      ctx.fillStyle = t.state === 'flee' ? '#ffd35c' : '#8b97b0';
      ctx.font = 'bold 13px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(t.state === 'flee' ? '!' : '?', t.x, t.y - 13);
    }
  } else if (t.mark > 0) {
    // フォグ越しに輪郭だけ残る（マーク状態）
    const a = Math.min(1, t.mark / T.markDuration) * .85;
    ctx.strokeStyle = `rgba(255,90,60,${a})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(t.x, t.y, 9, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawCop() {
  ctx.fillStyle = '#4ea3ff';
  ctx.beginPath(); ctx.arc(cop.x, cop.y, 9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#cfe6ff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cop.x, cop.y, 9, 0, Math.PI * 2); ctx.stroke();
  // 向き
  ctx.strokeStyle = '#cfe6ff'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cop.x, cop.y);
  ctx.lineTo(cop.x + Math.cos(cop.facing) * 14, cop.y + Math.sin(cop.facing) * 14);
  ctx.stroke();
}

function drawEffects() {
  for (const e of effects) {
    const p = 1 - e.life / e.max;
    ctx.strokeStyle = `rgba(255,220,120,${1 - p})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(e.x, e.y, 10 + p * 26, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawHUD(copArea) {
  ctx.fillStyle = '#10131d';
  ctx.fillRect(0, 0, FIELD_W, HUD_H);
  ctx.fillStyle = '#242c40';
  ctx.fillRect(0, HUD_H - 1, FIELD_W, 1);

  const caught = thieves.filter(t => t.jailed).length;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#8b97b0';
  ctx.font = '11px system-ui';
  ctx.fillText('収監', 20, 18);
  ctx.fillStyle = caught === 4 ? '#7dffa8' : '#e8eefc';
  ctx.font = 'bold 24px system-ui';
  ctx.fillText(`${caught} / 4`, 20, 37);

  const m = Math.floor(timeLeft / 60), s = Math.floor(timeLeft % 60);
  ctx.fillStyle = '#8b97b0';
  ctx.font = '11px system-ui';
  ctx.fillText('残り時間', 120, 18);
  ctx.fillStyle = timeLeft < 30 ? '#ff7a6a' : '#e8eefc';
  ctx.font = 'bold 24px system-ui';
  ctx.fillText(`${m}:${String(s).padStart(2, '0')}`, 120, 37);

  ctx.fillStyle = '#8b97b0';
  ctx.font = '11px system-ui';
  ctx.fillText('現在エリア', 232, 18);
  ctx.fillStyle = '#9fd0ff';
  ctx.font = 'bold 20px system-ui';
  ctx.fillText(AREA_NAMES[Math.floor(copArea / 3)][copArea % 3], 232, 38);

  // スタミナ
  ctx.fillStyle = '#8b97b0';
  ctx.font = '11px system-ui';
  ctx.fillText('スタミナ', 340, 18);
  ctx.fillStyle = '#232b3d';
  ctx.fillRect(340, 30, 180, 12);
  ctx.fillStyle = cop.exhausted ? '#ff7a6a' : '#4ea3ff';
  ctx.fillRect(340, 30, 180 * cop.stamina, 12);
  if (cop.exhausted) {
    // 再ダッシュ可能になるラインを示す
    ctx.fillStyle = '#ffd35c';
    ctx.fillRect(340 + 180 * T.exhaustThreshold - 1, 28, 2, 16);
  }

  // 視認中の泥棒
  const visible = thieves.filter(t => !t.jailed && (areaOf(t.x, t.y) === copArea || t.mark > 0)).length;
  ctx.fillStyle = '#8b97b0';
  ctx.font = '11px system-ui';
  ctx.fillText('視認中', 560, 18);
  ctx.fillStyle = visible ? '#ff9a6a' : '#4d566d';
  ctx.font = 'bold 24px system-ui';
  ctx.fillText(String(visible), 560, 37);

  // 仲間の状況。位置は常に見えるので、その状態がそのまま索敵の手がかりになる。
  const allyArea = areaOf(ally.x, ally.y);
  const alert = ally.state === 'alert';
  ctx.fillStyle = '#8b97b0';
  ctx.font = '11px system-ui';
  ctx.fillText('仲間', 630, 18);
  ctx.fillStyle = alert ? '#ffb43c' : '#7f8aa3';
  ctx.font = 'bold 17px system-ui';
  ctx.fillText(`${AREA_NAMES[Math.floor(allyArea / 3)][allyArea % 3]}で${alert ? '警戒中' : '平時'}`, 630, 38);

  ctx.fillStyle = '#4d566d';
  ctx.font = '11px system-ui';
  ctx.textAlign = 'right';
  ctx.fillText('ケイドロ プロトタイプ v0.3', FIELD_W - 20, 28);
}

function drawResult() {
  if (phase === 'play') return;
  ctx.fillStyle = 'rgba(6,8,16,.82)';
  ctx.fillRect(0, 0, FIELD_W, FIELD_H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (phase === 'win') {
    ctx.fillStyle = '#7dffa8';
    ctx.font = 'bold 46px system-ui';
    ctx.fillText('全員収監', FIELD_W / 2, FIELD_H / 2 - 40);
    ctx.fillStyle = '#cdd6e6';
    ctx.font = '18px system-ui';
    ctx.fillText(`所要 ${elapsed.toFixed(1)} 秒　／　残り ${timeLeft.toFixed(1)} 秒`, FIELD_W / 2, FIELD_H / 2 + 8);
  } else {
    const caught = thieves.filter(t => t.jailed).length;
    ctx.fillStyle = '#ff7a6a';
    ctx.font = 'bold 46px system-ui';
    ctx.fillText('時間切れ', FIELD_W / 2, FIELD_H / 2 - 40);
    ctx.fillStyle = '#cdd6e6';
    ctx.font = '18px system-ui';
    ctx.fillText(`収監 ${caught} / 4`, FIELD_W / 2, FIELD_H / 2 + 8);
  }
  ctx.fillStyle = '#8b97b0';
  ctx.font = '16px system-ui';
  ctx.fillText(isTouch ? '画面をタップでリスタート' : 'R キーでリスタート', FIELD_W / 2, FIELD_H / 2 + 52);
}

function render() {
  const copArea = areaOf(cop.x, cop.y);
  ctx.clearRect(0, 0, cv.width, cv.height);
  drawHUD(copArea);

  ctx.save();
  ctx.translate(0, HUD_H);
  drawMap();
  drawJail();
  drawFog(copArea);
  for (const t of thieves) drawThief(t, copArea);
  drawAlly();
  drawCop();
  drawEffects();
  drawResult();
  ctx.restore();
}

// ---------------------------------------------------------------------------
// メインループ
// ---------------------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
